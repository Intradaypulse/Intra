name: Build PDFMate Beta APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "integration_test/**"
      - ".github/workflows/build-pdfmate-test-apk.yml"

permissions:
  contents: read

concurrency:
  group: pdfmate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Create Android project
        run: |
          flutter --version
          flutter create --platforms=android --org com.pdfmateapp --project-name pdfmate buildapp
          cp src/pubspec.yaml buildapp/pubspec.yaml
          cp src/*.dart buildapp/lib/
          rm -f buildapp/test/widget_test.dart
          mkdir -p buildapp/test
          if [ -d test ]; then cp -r test/. buildapp/test/; fi

      - name: Configure Android, branding and OCR models
        shell: bash
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          app_id = os.environ.get(
              "ADMOB_APP_ID",
              "",
          ).strip() or "ca-app-pub-3940256099942544~3347511713"

          manifest = Path("buildapp/android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          if 'android.permission.CAMERA' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.CAMERA"/>'
              )
          s = s.replace('android:label="pdfmate"', 'android:label="PDFMate"')
          s = s.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@drawable/pdfmate_launcher_icon" '
              'android:roundIcon="@drawable/pdfmate_launcher_icon"'
          )
          marker = '<application'
          pos = s.find(marker)
          app_open = s.find('>', pos)
          meta = (
              '\n        <meta-data\n'
              '            android:name="com.google.android.gms.ads.APPLICATION_ID"\n'
              f'            android:value="{app_id}"/>'
          )
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s = s[:app_open+1] + meta + s[app_open+1:]
          manifest.write_text(s)

          gradle = Path("buildapp/android/app/build.gradle.kts")
          g = gradle.read_text()
          g = g.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 36",
          )
          g = g.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23",
          )
          g = g.replace(
              "targetSdk = flutter.targetSdkVersion",
              "targetSdk = 36",
          )
          g += """
          \n
          dependencies {
              implementation("com.google.mlkit:text-recognition-chinese:16.0.1")
              implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
              implementation("com.google.mlkit:text-recognition-korean:16.0.1")
          }
          """
          gradle.write_text(g)

          drawable = Path("buildapp/android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / "pdfmate_launcher_icon.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#315EF5"
                  android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M28,15h34l18,18v60h-52z"/>
              <path android:fillColor="#B9C7FF"
                  android:pathData="M62,15v18h18z"/>
              <path android:fillColor="#315EF5"
                  android:pathData="M38,49h32v6h-32zM38,62h32v6h-32zM38,75h23v6h-23z"/>
          </vector>
          """)

          launch = drawable / "launch_background.xml"
          launch.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="#315EF5"/>
              <item
                  android:width="108dp"
                  android:height="108dp"
                  android:gravity="center"
                  android:drawable="@drawable/pdfmate_launcher_icon"/>
          </layer-list>
          """)
          PY

      - name: Resolve packages
        working-directory: buildapp
        run: flutter pub get

      - name: Analyze source
        working-directory: buildapp
        run: flutter analyze --no-fatal-infos

      - name: Run regression tests
        working-directory: buildapp
        run: flutter test

      - name: Build ARM64 debug APK
        working-directory: buildapp
        env:
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_APP_OPEN_ID: ${{ secrets.ADMOB_APP_OPEN_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        shell: bash
        run: |
          defines=()
          [[ -n "$ADMOB_BANNER_ID" ]] && defines+=(--dart-define=ADMOB_BANNER_ID="$ADMOB_BANNER_ID")
          [[ -n "$ADMOB_INTERSTITIAL_ID" ]] && defines+=(--dart-define=ADMOB_INTERSTITIAL_ID="$ADMOB_INTERSTITIAL_ID")
          [[ -n "$ADMOB_REWARDED_ID" ]] && defines+=(--dart-define=ADMOB_REWARDED_ID="$ADMOB_REWARDED_ID")
          [[ -n "$ADMOB_APP_OPEN_ID" ]] && defines+=(--dart-define=ADMOB_APP_OPEN_ID="$ADMOB_APP_OPEN_ID")
          [[ -n "$FIREBASE_API_KEY" ]] && defines+=(--dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY")
          [[ -n "$FIREBASE_APP_ID" ]] && defines+=(--dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID")
          [[ -n "$FIREBASE_PROJECT_ID" ]] && defines+=(--dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID")
          [[ -n "$FIREBASE_MESSAGING_SENDER_ID" ]] && defines+=(--dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID")
          [[ -n "$FIREBASE_STORAGE_BUCKET" ]] && defines+=(--dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET")
          flutter build apk --debug --target-platform android-arm64 "${defines[@]}"

      - name: Verify APK
        run: |
          test -f buildapp/build/app/outputs/flutter-apk/app-debug.apk
          cp buildapp/build/app/outputs/flutter-apk/app-debug.apk PDFMate-Beta-arm64.apk
          sha256sum PDFMate-Beta-arm64.apk | tee PDFMate-Beta-arm64.apk.sha256
          ls -lh PDFMate-Beta-arm64.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PDFMate-Beta-APK
          path: |
            PDFMate-Beta-arm64.apk
            PDFMate-Beta-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Build release-candidate universal APK and AAB
        working-directory: buildapp
        shell: bash
        run: |
          # Generated Flutter projects intentionally use the debug keystore for
          # local release builds. These artifacts verify release-mode/R8/AAB
          # architecture only and are never the Play Store signing identity.
          flutter build apk --release
          flutter build appbundle --release

      - name: Verify release-candidate artifacts
        shell: bash
        run: |
          test -f buildapp/build/app/outputs/flutter-apk/app-release.apk
          test -f buildapp/build/app/outputs/bundle/release/app-release.aab
          cp buildapp/build/app/outputs/flutter-apk/app-release.apk PDFMate-RC-universal.apk
          cp buildapp/build/app/outputs/bundle/release/app-release.aab PDFMate-RC-test-signed.aab
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose PDFMate-RC-universal.apk
          jarsigner -verify PDFMate-RC-test-signed.aab
          sha256sum PDFMate-RC-universal.apk | tee PDFMate-RC-universal.apk.sha256
          sha256sum PDFMate-RC-test-signed.aab | tee PDFMate-RC-test-signed.aab.sha256
          ls -lh PDFMate-RC-universal.apk PDFMate-RC-test-signed.aab

      - name: Upload release-candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDFMate-Release-Candidate
          path: |
            PDFMate-RC-universal.apk
            PDFMate-RC-universal.apk.sha256
            PDFMate-RC-test-signed.aab
            PDFMate-RC-test-signed.aab.sha256
          if-no-files-found: error
          retention-days: 14
