name: PDFMate Android Native Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "integration_test/**"
      - ".github/workflows/android-native-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdfmate-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Create integration app
        shell: bash
        run: |
          flutter create --platforms=android --org com.pdfmateapp --project-name pdfmate buildapp
          cp src/pubspec.yaml buildapp/pubspec.yaml
          cp src/*.dart buildapp/lib/
          mkdir -p buildapp/integration_test
          cp integration_test/*.dart buildapp/integration_test/
          rm -f buildapp/test/widget_test.dart

          python3 - <<'PY'
          from pathlib import Path
          p = Path("buildapp/android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
          s = s.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
          p.write_text(s)
          PY

          cd buildapp
          flutter pub get

      - name: Run native PDF integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd buildapp
            flutter test integration_test/android_native_pdf_smoke_test.dart -d emulator-5554
