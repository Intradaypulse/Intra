name: PDFMate Android Device Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android_native/**"
      - "scripts/**"
      - "integration_test/**"
      - ".github/workflows/android-device-smoke.yml"

permissions:
  contents: read

concurrency:
  group: pdfmate-device-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            profile: pixel_2
          - api: 29
            profile: pixel_2
          - api: 35
            profile: pixel_6

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Create Android integration project
        run: |
          flutter create --platforms=android --org com.pdfmateapp --project-name pdfmate buildapp
          cp src/pubspec.yaml buildapp/pubspec.yaml
          cp src/*.dart buildapp/lib/
          cp -r src/assets buildapp/assets
          python3 scripts/configure_native_overlay.py
          rm -f buildapp/test/widget_test.dart
          mkdir -p buildapp/integration_test
          cp -r integration_test/. buildapp/integration_test/

      - name: Configure Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("buildapp/android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          if 'android.permission.CAMERA' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.CAMERA"/>\n'
                  '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n'
                  '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>'
              )

          marker = '<application'
          pos = s.find(marker)
          app_open = s.find('>', pos)
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              meta = (
                  '\n        <meta-data\n'
                  '            android:name="com.google.android.gms.ads.APPLICATION_ID"\n'
                  '            android:value="ca-app-pub-3940256099942544~3347511713"/>'
              )
              s = s[:app_open+1] + meta + s[app_open+1:]
          manifest.write_text(s)

          gradle = Path("buildapp/android/app/build.gradle.kts")
          g = gradle.read_text()
          g = g.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          g = g.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
          g = g.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
          g += """
          
          dependencies {
              implementation("com.google.mlkit:text-recognition-chinese:16.0.1")
              implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
              implementation("com.google.mlkit:text-recognition-korean:16.0.1")
          }
          """
          gradle.write_text(g)
          PY

      - name: Resolve dependencies
        working-directory: buildapp
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android native smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          working-directory: buildapp
          script: |
            flutter build apk --debug
            adb install -r -g build/app/outputs/flutter-apk/app-debug.apk
            flutter test integration_test/pdf_viewer_smoke_test.dart -d emulator-5554
            flutter test integration_test/android_native_pdf_smoke_test.dart -d emulator-5554
