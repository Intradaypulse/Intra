name: PDFMate Flutter Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:
  latest-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up latest Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create compatibility app
        shell: bash
        run: |
          flutter --version
          flutter create --platforms=android --org com.pdfmateapp --project-name pdfmate buildapp
          cp src/pubspec.yaml buildapp/pubspec.yaml
          cp src/*.dart buildapp/lib/
          rm -f buildapp/test/widget_test.dart
          mkdir -p buildapp/test
          if [ -d test ]; then cp -r test/. buildapp/test/; fi

          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("buildapp/android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          root = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if 'android.permission.CAMERA' not in m:
              m = m.replace(
                  root,
                  root + '\n'
                  '    <uses-permission android:name="android.permission.CAMERA"/>\n'
                  '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n'
                  '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>'
              )
          manifest.write_text(m)

          p = Path("buildapp/android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
          s = s.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
          p.write_text(s)
          PY

      - name: Resolve dependencies
        working-directory: buildapp
        run: flutter pub get

      - name: Check outdated dependencies
        working-directory: buildapp
        run: flutter pub outdated || true

      - name: Analyze
        working-directory: buildapp
        run: flutter analyze --no-fatal-infos

      - name: Run regression and widget tests
        working-directory: buildapp
        run: flutter test

      - name: Build compatibility APK
        working-directory: buildapp
        run: flutter build apk --debug --target-platform android-arm64
