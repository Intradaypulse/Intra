name: Build PDFMate Release AAB

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or commit
        required: true
        default: main

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate production configuration
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_APP_OPEN_ID: ${{ secrets.ADMOB_APP_OPEN_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
          PDFMATE_OPERATOR_NAME: ${{ vars.PDFMATE_OPERATOR_NAME }}
          PDFMATE_PRIVACY_EMAIL: ${{ vars.PDFMATE_PRIVACY_EMAIL }}
          PDFMATE_PRIVACY_URL: ${{ vars.PDFMATE_PRIVACY_URL }}
        run: |
          require() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "::error::Missing required production secret: $name"
              exit 1
            fi
          }

          require ANDROID_UPLOAD_CERT_SHA256 "$ANDROID_UPLOAD_CERT_SHA256"
          require PDFMATE_OPERATOR_NAME "$PDFMATE_OPERATOR_NAME"
          require PDFMATE_PRIVACY_EMAIL "$PDFMATE_PRIVACY_EMAIL"
          require PDFMATE_PRIVACY_URL "$PDFMATE_PRIVACY_URL"
          require ANDROID_KEYSTORE_BASE64 "$KEYSTORE_B64"
          require ANDROID_KEYSTORE_PASSWORD "$KEYSTORE_PASSWORD"
          require ANDROID_KEY_ALIAS "$KEY_ALIAS"
          require ANDROID_KEY_PASSWORD "$KEY_PASSWORD"
          require ADMOB_APP_ID "$ADMOB_APP_ID"
          require ADMOB_BANNER_ID "$ADMOB_BANNER_ID"
          require ADMOB_INTERSTITIAL_ID "$ADMOB_INTERSTITIAL_ID"
          require ADMOB_REWARDED_ID "$ADMOB_REWARDED_ID"
          require ADMOB_APP_OPEN_ID "$ADMOB_APP_OPEN_ID"
          require FIREBASE_API_KEY "$FIREBASE_API_KEY"
          require FIREBASE_APP_ID "$FIREBASE_APP_ID"
          require FIREBASE_PROJECT_ID "$FIREBASE_PROJECT_ID"
          require FIREBASE_MESSAGING_SENDER_ID "$FIREBASE_MESSAGING_SENDER_ID"
          require FIREBASE_STORAGE_BUCKET "$FIREBASE_STORAGE_BUCKET"

          for value in "$ADMOB_APP_ID" "$ADMOB_BANNER_ID" "$ADMOB_INTERSTITIAL_ID" "$ADMOB_REWARDED_ID" "$ADMOB_APP_OPEN_ID"; do
            if [[ "$value" == *"3940256099942544"* ]]; then
              echo "::error::Google test AdMob IDs are forbidden in the production release."
              exit 1
            fi
          done

          if [[ ! "$ADMOB_APP_ID" =~ ^ca-app-pub-[0-9]+~[0-9]+$ ]]; then
            echo "::error::ADMOB_APP_ID must use ca-app-pub-...~... format."
            exit 1
          fi

          for pair in             "ADMOB_BANNER_ID:$ADMOB_BANNER_ID"             "ADMOB_INTERSTITIAL_ID:$ADMOB_INTERSTITIAL_ID"             "ADMOB_REWARDED_ID:$ADMOB_REWARDED_ID"             "ADMOB_APP_OPEN_ID:$ADMOB_APP_OPEN_ID"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [[ ! "$value" =~ ^ca-app-pub-[0-9]+/[0-9]+$ ]]; then
              echo "::error::$name must use ca-app-pub-.../... format."
              exit 1
            fi
          done

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}

      - name: Validate production values
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_APP_OPEN_ID: ${{ secrets.ADMOB_APP_OPEN_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
          PDFMATE_OPERATOR_NAME: ${{ vars.PDFMATE_OPERATOR_NAME }}
          PDFMATE_PRIVACY_EMAIL: ${{ vars.PDFMATE_PRIVACY_EMAIL }}
          PDFMATE_PRIVACY_URL: ${{ vars.PDFMATE_PRIVACY_URL }}
        run: python3 scripts/check_production_config.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Create Android project
        run: |
          flutter create --platforms=android --org com.pdfmateapp --project-name pdfmate buildapp
          cp src/pubspec.yaml buildapp/pubspec.yaml
          cp src/pubspec.lock buildapp/pubspec.lock
          cp src/*.dart buildapp/lib/
          cp -r src/assets buildapp/assets
          python3 scripts/configure_native_overlay.py
          rm -f buildapp/test/widget_test.dart
          mkdir -p buildapp/test
          if [ -d test ]; then cp -r test/. buildapp/test/; fi

      - name: Configure Android release
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
          PDFMATE_OPERATOR_NAME: ${{ vars.PDFMATE_OPERATOR_NAME }}
          PDFMATE_PRIVACY_EMAIL: ${{ vars.PDFMATE_PRIVACY_EMAIL }}
          PDFMATE_PRIVACY_URL: ${{ vars.PDFMATE_PRIVACY_URL }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > buildapp/android/app/pdfmate-upload.jks
          python3 - <<'PY'
          import os
          from pathlib import Path

          settings = Path("buildapp/android/settings.gradle.kts")
          settings_text = settings.read_text()
          loader = 'id("dev.flutter.flutter-plugin-loader") version "1.0.0"'
          firebase_plugins = (
              '\n    id("com.google.gms.google-services") version "4.5.0" apply false'
              '\n    id("com.google.firebase.crashlytics") version "3.0.8" apply false'
          )
          if 'com.google.gms.google-services' not in settings_text:
              settings_text = settings_text.replace(
                  loader,
                  loader + firebase_plugins,
              )
          settings.write_text(settings_text)

          app_gradle = Path("buildapp/android/app/build.gradle.kts")
          app_text = app_gradle.read_text()
          flutter_plugin = 'id("dev.flutter.flutter-gradle-plugin")'
          firebase_apply = (
              '\n    id("com.google.gms.google-services")'
              '\n    id("com.google.firebase.crashlytics")'
          )
          if 'com.google.gms.google-services' not in app_text:
              app_text = app_text.replace(
                  flutter_plugin,
                  flutter_plugin + firebase_apply,
              )
          app_gradle.write_text(app_text)

          import json
          google_services = {
              "project_info": {
                  "project_number": os.environ["FIREBASE_MESSAGING_SENDER_ID"],
                  "project_id": os.environ["FIREBASE_PROJECT_ID"],
                  "storage_bucket": os.environ["FIREBASE_STORAGE_BUCKET"],
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": os.environ["FIREBASE_APP_ID"],
                      "android_client_info": {
                          "package_name": "com.pdfmateapp.pdfmate",
                      },
                  },
                  "api_key": [{
                      "current_key": os.environ["FIREBASE_API_KEY"],
                  }],
                  "services": {
                      "appinvite_service": {
                          "other_platform_oauth_client": [],
                      },
                  },
              }],
              "configuration_version": "1",
          }
          Path("buildapp/android/app/google-services.json").write_text(
              json.dumps(google_services, separators=(",", ":")),
          )

          manifest = Path("buildapp/android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          if 'android.permission.CAMERA' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.CAMERA"/>\n'
                  '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n'
                  '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>'
              )
          s = s.replace('android:label="pdfmate"', 'android:label="PDFMate"')
          s = s.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@drawable/pdfmate_launcher_icon" '
              'android:roundIcon="@drawable/pdfmate_launcher_icon"'
          )
          marker = '<application'
          pos = s.find(marker)
          app_open = s.find('>', pos)
          meta = (
              '\n        <meta-data\n'
              '            android:name="com.google.android.gms.ads.APPLICATION_ID"\n'
              f'            android:value="{os.environ["ADMOB_APP_ID"]}"/>'
          )
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s = s[:app_open+1] + meta + s[app_open+1:]
          manifest.write_text(s)

          gradle = Path("buildapp/android/app/build.gradle.kts")
          g = gradle.read_text()
          g = g.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          g = g.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
          g = g.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
          g += """
          
          dependencies {
              implementation("com.google.mlkit:text-recognition-chinese:16.0.1")
              implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
              implementation("com.google.mlkit:text-recognition-korean:16.0.1")
          }
          """
          block = '''
              signingConfigs {
                  create("release") {
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                      storeFile = file("pdfmate-upload.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
          '''
          g = g.replace("    buildTypes {", block + "\n    buildTypes {")
          g = g.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )
          gradle.write_text(g)

          drawable = Path("buildapp/android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / "pdfmate_launcher_icon.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#315EF5"
                  android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M28,15h34l18,18v60h-52z"/>
              <path android:fillColor="#B9C7FF"
                  android:pathData="M62,15v18h18z"/>
              <path android:fillColor="#315EF5"
                  android:pathData="M38,49h32v6h-32zM38,62h32v6h-32zM38,75h23v6h-23z"/>
          </vector>
          """)
          (drawable / "launch_background.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="#315EF5"/>
              <item
                  android:width="108dp"
                  android:height="108dp"
                  android:gravity="center"
                  android:drawable="@drawable/pdfmate_launcher_icon"/>
          </layer-list>
          """)
          PY

      - name: Verify Firebase Gradle configuration
        shell: bash
        run: |
          grep -q 'com.google.gms.google-services' buildapp/android/settings.gradle.kts
          grep -q 'com.google.firebase.crashlytics' buildapp/android/settings.gradle.kts
          grep -q 'com.google.gms.google-services' buildapp/android/app/build.gradle.kts
          grep -q 'com.google.firebase.crashlytics' buildapp/android/app/build.gradle.kts
          test -s buildapp/android/app/google-services.json
          python3 -m json.tool buildapp/android/app/google-services.json >/dev/null

      - name: Verify upload keystore and alias
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          keytool -list             -keystore buildapp/android/app/pdfmate-upload.jks             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null
          keytool -exportcert -keystore buildapp/android/app/pdfmate-upload.jks -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" -file /tmp/pdfmate-upload-cert.der
          python3 - <<'PYVERIFY'
          import hashlib, os
          from pathlib import Path
          expected = os.environ['ANDROID_UPLOAD_CERT_SHA256'].replace(':', '').lower()
          actual = hashlib.sha256(Path('/tmp/pdfmate-upload-cert.der').read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit('Upload certificate does not match the pinned signing identity. Refusing release.')
          print('Pinned upload certificate verified.')
          PYVERIFY
          echo "Upload keystore alias verified."

      - name: Resolve and analyze
        working-directory: buildapp
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos

      - name: Test native save cancellation
        run: |
          mkdir -p /tmp/pdfmate-native-tests
          javac -d /tmp/pdfmate-native-tests android_native/CancellableOutputStream.java test/native/CancellableOutputStreamTest.java
          java -cp /tmp/pdfmate-native-tests CancellableOutputStreamTest

      - name: Run regression tests
        working-directory: buildapp
        run: flutter test

      - name: Build signed release AAB
        working-directory: buildapp
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_APP_OPEN_ID: ${{ secrets.ADMOB_APP_OPEN_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
          PDFMATE_OPERATOR_NAME: ${{ vars.PDFMATE_OPERATOR_NAME }}
          PDFMATE_PRIVACY_EMAIL: ${{ vars.PDFMATE_PRIVACY_EMAIL }}
          PDFMATE_PRIVACY_URL: ${{ vars.PDFMATE_PRIVACY_URL }}
        shell: bash
        run: |
          args=(
            --release
            --dart-define=ADMOB_BANNER_ID="$ADMOB_BANNER_ID"
            --dart-define=ADMOB_INTERSTITIAL_ID="$ADMOB_INTERSTITIAL_ID"
            --dart-define=ADMOB_REWARDED_ID="$ADMOB_REWARDED_ID"
            --dart-define=ADMOB_APP_OPEN_ID="$ADMOB_APP_OPEN_ID"
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET"
            --dart-define=PDFMATE_OPERATOR_NAME="$PDFMATE_OPERATOR_NAME"
            --dart-define=PDFMATE_PRIVACY_EMAIL="$PDFMATE_PRIVACY_EMAIL"
            --dart-define=PDFMATE_PRIVACY_URL="$PDFMATE_PRIVACY_URL"
          )
          flutter build appbundle "${args[@]}"
          flutter build apk --release --split-per-abi "${args[@]}"

      - name: Verify production signatures and checksums
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -f buildapp/build/app/outputs/bundle/release/app-release.aab
          cp buildapp/build/app/outputs/bundle/release/app-release.aab PDFMate-release.aab
          # Trust only the configured upload identity, not an arbitrary signer.
          keytool -exportcert -keystore buildapp/android/app/pdfmate-upload.jks -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" -file /tmp/pdfmate-upload.cer
          keytool -importcert -noprompt -keystore /tmp/pdfmate-verify.p12 -storepass verification-only -alias expected-upload -file /tmp/pdfmate-upload.cer
          jarsigner -verify -strict -certs -keystore /tmp/pdfmate-verify.p12 -storepass verification-only PDFMate-release.aab expected-upload

          mkdir -p release-apks
          cp buildapp/build/app/outputs/flutter-apk/app-*-release.apk release-apks/
          test -n "$(find release-apks -name '*.apk' -print -quit)"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          for apk in release-apks/*.apk; do
            python3 scripts/verify_work_database.py "$apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done

          sha256sum PDFMate-release.aab | tee PDFMate-release.aab.sha256
          sha256sum release-apks/*.apk | tee PDFMate-release-apks.sha256
          ls -lh PDFMate-release.aab release-apks/*.apk

      - name: Enable KVM for production startup test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cold-launch exact production APK twice
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/check_release_launch.sh release-apks/app-x86_64-release.apk

      - name: Upload production startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDFMate-Production-startup-diagnostics
          path: release-launch-logs/
          if-no-files-found: ignore

      - name: Upload production release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDFMate-Production-Release
          path: |
            PDFMate-release.aab
            PDFMate-release.aab.sha256
            PDFMate-release-apks.sha256
            release-apks/*.apk
          if-no-files-found: error
          retention-days: 30
