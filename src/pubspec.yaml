name: pdfmate
description: PDFMate beta build
publish_to: none
version: 0.3.0+3

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  camera: ^0.12.0+2
  pdf: ^3.13.1
  printing: ^5.14.3
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  google_mobile_ads: ^9.1.0
  firebase_remote_config: ^6.7.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  shared_preferences: ^2.5.3
  file_picker: ^13.1.0
  file_saver: ^0.6.0
  permission_handler: ^12.0.1
  pdf_manipulator: 5.0.1
  pdfx: ^2.11.0
  document_scan: ^0.3.1
  google_mlkit_text_recognition: ^0.17.1
  signature: ^6.4.0
  image: ^4.10.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
